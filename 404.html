<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found · Savepoint</title>
    <meta name="theme-color" content="#171a21">
    <!-- GitHub Pages serves this for any missing URL, from any depth, so links can't be relative.
         deploy.yml replaces __BASE__ with the site's path (/<repo>/, or / on a custom domain). -->
    <link rel="icon" type="image/svg+xml" href="__BASE__assets/favicon.svg">
    <style>
        html, body { margin: 0; min-height: 100%; background: #171a21; color: #c6d4df; font-family: 'Segoe UI', Arial, sans-serif; }
        main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
        .card { width: min(420px, 100%); background: #1b2838; border: 1px solid #2a475e; border-radius: 3px; padding: 28px 24px; text-align: center; animation: in .25s ease-out backwards; }
        .card img { width: 64px; height: 64px; opacity: .9; }
        .code { font-size: 44px; font-weight: 700; letter-spacing: .08em; color: #66c0f4; margin: 10px 0 4px; }
        h1 { font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #fff; margin: 0 0 10px; }
        p { font-size: 13px; color: #8f98a0; margin: 0 0 20px; line-height: 1.5; }
        a.btn { display: inline-block; padding: 8px 16px; background: #66c0f4; color: #0e1a26; font-size: 13px; font-weight: 600; border-radius: 2px; text-decoration: none; }
        a.btn:hover { background: #8fd3ff; }
        @keyframes in { from { opacity: 0; transform: translateY(6px); } }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="__BASE__assets/favicon.svg" alt="">
            <div class="code">404</div>
            <h1>No save data here</h1>
            <p>This page doesn't exist. It may have moved, or the link is wrong.</p>
            <a class="btn" href="__BASE__">Back to the hub</a>
        </div>
    </main>
</body>
</html>
