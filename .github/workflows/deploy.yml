name: Deploy site

# GitHub Pages is deployed from this workflow (Pages source: GitHub Actions), not built from a
# branch. The site is main's files plus the pipeline output from the `data` branch, at the same
# paths as before. Runs on every push to main, and as the second job of fetch-data.yml when a
# pipeline run changed data (pushes made with GITHUB_TOKEN don't trigger workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # Before the first data run there is no data branch: the site deploys without data
      - name: Look for the data branch
        id: data
        run: echo "exists=$(git ls-remote --exit-code --heads origin data >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout data branch
        if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - uses: actions/configure-pages@v5
        id: pages

      # Private files are excluded here :
      # notes, backlog, local tooling, and the pipeline-only caches from scripts/data-paths.json
      - name: Assemble site
        run: |
          rsync -a --exclude-from=- ./ _site/ <<'EOF'
          /.git/
          /.github/
          /.gitignore
          /_data/
          /_site/
          /node_modules/
          /.data-snapshot/
          CLAUDE.md
          .DS_Store
          /TODO.md
          /README.md
          /backlog/
          /docs/
          /admin/
          /scripts/
          /package.json
          /package-lock.json
          /.env
          /.claude/
          /.agents/
          /LICENSE
          /.env.example
          /assets/appicon.png
          EOF
          if [ -d _data/data ]; then cp -R _data/data/. _site/data/; fi
          for f in $(node -p "require('./scripts/data-paths.json').private.join(' ')"); do rm -f "_site/$f"; done
          # Shared series progress, from the hand-made data/hub/series.json and the platform data
          node scripts/build-series.js _site
          # 404.html can be served at any depth, so its links are absolute: /<repo>/ or / on a custom domain
          base="${{ steps.pages.outputs.base_path }}/"
          sed -i "s#__BASE__#${base}#g" _site/404.html
          echo "Site: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
